<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#111111" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="Larder Lichfield weekly performance report" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="stylesheet" href="./styles.css" />
    <title>Larder performance report</title>
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <button class="menu-button" id="menu-button" type="button" aria-haspopup="dialog" aria-controls="menu-drawer">
          <span></span><span></span><span></span>
          <span class="sr-only">Open report menu</span>
        </button>
        <div class="brand" aria-label="Larder Lichfield">
          <p>THE LARDER</p>
          <h1>Weekly performance</h1>
        </div>
        <button class="week-button" id="week-button" type="button" aria-label="Open weekly report update">
          <span class="week-button__label">Week ending</span>
          <strong id="top-week">—</strong>
        </button>
      </header>

      <div class="drawer-backdrop" id="drawer-backdrop" hidden></div>
      <aside class="menu-drawer" id="menu-drawer" aria-label="Report sections" aria-hidden="true">
        <div class="drawer-heading">
          <div>
            <p>REPORT MENU</p>
            <h2>Explore performance</h2>
          </div>
          <button class="close-button" id="close-menu" type="button" aria-label="Close report menu">×</button>
        </div>
        <nav id="section-menu"></nav>
        <div class="drawer-footer">Select a section to view its weekly data.</div>
      </aside>

      <main id="app" tabindex="-1" aria-live="polite">
        <div class="loading">Loading the report…</div>
      </main>
    </div>
    <input id="weekly-report-input" type="file" accept=".xlsx,.xlsm,.xls,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel" hidden />
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="./report-data.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
